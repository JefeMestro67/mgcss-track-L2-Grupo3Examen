name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Ejecutar tests y analisis Sonar
        working-directory: ./Proyecto_Mantenimiento
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn clean -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
          -Dsonar.projectKey=franciscorrego_mgcss-track-L2-Grupo3 
          -Dsonar.organization=franciscorrego 
          -Dsonar.host.url=https://sonarcloud.io 
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: quality-gate
    permissions:
      contents: write

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Compilar y generar artefacto
        working-directory: ./Proyecto_Mantenimiento
        run: mvn clean package -DskipTests

      - name: Renombrar artefacto
        working-directory: ./Proyecto_Mantenimiento
        run: mv target/*.jar target/mgcss-track-${{ github.ref_name }}.jar

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar imagen Docker
        run: |
          docker build -t franciscorrego/mgcss-track:${{ github.ref_name }} -t franciscorrego/mgcss-track:latest -f Proyecto_Mantenimiento/Dockerfile Proyecto_Mantenimiento
          docker push franciscorrego/mgcss-track:${{ github.ref_name }}
          docker push franciscorrego/mgcss-track:latest

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Proyecto_Mantenimiento/target/mgcss-track-${{ github.ref_name }}.jar
