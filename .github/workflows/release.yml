name: MGCSS - Continuous Delivery Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Quality Gate and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Code and Run SonarCloud Quality Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn clean verify sonar:sonar -Dsonar.qualitygate.wait=true

      - name: Package Application
        run: mvn package -DskipTests

      - name: Build Docker Image
        run: |
          docker build -t mgcss-track:${{ github.ref_name }} .
          echo "Imagen Docker construida con exito."

      - name: Publish Automated GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/*.jar
          body_path: docs/release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
